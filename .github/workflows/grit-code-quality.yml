name: grit-code-quality

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH_PREFIX: 'grit-fixes'
  # Added the missing pattern configuration here
  GRIT_PATTERN: 'standard' 

jobs:
  grit-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.THE_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Grit
        run: |
          curl -fsSL https://docs.grit.io/install | bash
          echo "$HOME/.grit/bin" >> $GITHUB_PATH

      - name: Run Grit Check
        id: grit-check
        continue-on-error: true
        run: |
          # Added "$GRIT_PATTERN" argument here
          grit check "$GRIT_PATTERN" --level error || echo "GRIT_ERRORS=true" >> $GITHUB_OUTPUT

      - name: Apply Grit Fixes
        if: steps.grit-check.outputs.GRIT_ERRORS == 'true'
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          attempt_delay: 2000
          # Added "$GRIT_PATTERN" argument here as well
          command: grit apply "$GRIT_PATTERN" --force

      - name: Create Fix Branch
        if: steps.grit-check.outputs.GRIT_ERRORS == 'true'
        run: |
          BRANCH="${{ env.TARGET_BRANCH_PREFIX }}-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: apply Grit fixes [automated] [skip ci]" || exit 0

      - name: Push Changes
        if: steps.grit-check.outputs.GRIT_ERRORS == 'true'
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          attempt_delay: 5000
          command: git push origin HEAD